spring.application.name=mail-app

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mailapp}
spring.datasource.username=${DB_USER:mailapp}
spring.datasource.password=${DB_PASSWORD:mailapp}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.address=${MAIL_ADDRESS:sistema@mailapp.local}
app.mail.poll-interval=${POLL_INTERVAL:30s}
app.mail.pop3.host=${POP3_HOST:localhost}
app.mail.pop3.port=${POP3_PORT:1110}
app.mail.pop3.user=${POP3_USER:mailapp}
app.mail.pop3.password=${POP3_PASSWORD:mailapp}

app.initial-admin.name=${INITIAL_ADMIN_NAME:}
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:}

app.files.root=${FILES_ROOT:./data/files}
