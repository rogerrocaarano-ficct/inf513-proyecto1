spring.application.name=cpms

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Mail channel (NFR-007): POP3 on 110 and SMTP on 25, without encryption.
# Credentials and the system address come from environment variables.
cpms.mail.address=${CPMS_MAIL_ADDRESS:}
cpms.mail.batch-size=10
cpms.mail.poll-interval=30s
cpms.mail.polling-enabled=true
cpms.mail.pop3.host=${CPMS_MAIL_POP3_HOST:localhost}
cpms.mail.pop3.port=110
cpms.mail.pop3.username=${CPMS_MAIL_USERNAME:}
cpms.mail.pop3.password=${CPMS_MAIL_PASSWORD:}

spring.mail.host=${CPMS_MAIL_SMTP_HOST:localhost}
spring.mail.port=25
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# First administrator account, created at startup if no account uses this address (UC-001).
cpms.users.admin-email=${CPMS_ADMIN_EMAIL:}

# Folder where the files are kept (issue #9). Required: the application does not start without it.
cpms.storage.root=${CPMS_STORAGE_ROOT:}
