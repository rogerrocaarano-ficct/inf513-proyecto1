# Test environment profile, activated by compose.staging.yaml (deployed with Dokploy).
# Points to the services of that Compose file, reachable only inside its network. Same mailbox, administrator
# and test accounts as the local profile, so testers try the commands as on a developer machine.
# These credentials only work with the GreenMail and PostgreSQL of that Compose file.

spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:cpms}
spring.datasource.username=${POSTGRES_USER:cpms}
spring.datasource.password=${POSTGRES_PASSWORD:cpms}

# Disposable environment: DisposableDatabaseReset cleans the schema and migrates it again at every startup.
# Clean stays disabled in every other profile.
spring.flyway.clean-disabled=false

cpms.mail.address=sistema@cpms.local
cpms.mail.poll-interval=10s
cpms.mail.pop3.host=greenmail
cpms.mail.pop3.port=3110
cpms.mail.pop3.username=sistema@cpms.local
cpms.mail.pop3.password=secret

spring.mail.host=greenmail
spring.mail.port=3025

# First administrator account of the test environment (UC-001).
cpms.users.admin-email=admin@test.local

# Files of the test environment, in the cpms-storage volume of compose.staging.yaml.
cpms.storage.root=/var/lib/cpms/storage
