# Local development profile, activated by ./gradlew bootRun.
# Points to the containers of compose.yaml. These credentials only work with the local GreenMail;
# production keeps using environment variables (application.properties).

# Containers keep running when the application stops: faster restarts, mail kept between runs.
spring.docker.compose.lifecycle-management=start-only

cpms.mail.address=sistema@cpms.local
cpms.mail.poll-interval=10s
cpms.mail.pop3.host=localhost
cpms.mail.pop3.port=1110
cpms.mail.pop3.username=sistema@cpms.local
cpms.mail.pop3.password=secret

spring.mail.host=localhost
spring.mail.port=2525

# First administrator account of the local environment.
cpms.users.admin-email=admin@cpms.local
