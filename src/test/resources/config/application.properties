# Test overrides (loaded after the main application.properties).
# Tests call InboxPollerService.pollAndProcess() themselves and never reach the real mail server.
cpms.mail.polling-enabled=false
cpms.mail.address=sistema@cpms.test
cpms.mail.pop3.host=localhost
spring.mail.host=localhost

# bootTestRun gets its database from Testcontainers: do not start compose.yaml as well.
spring.docker.compose.enabled=false
