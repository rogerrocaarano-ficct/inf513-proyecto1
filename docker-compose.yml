# Development test stack: mail-app with a local PostgreSQL and a local mail server (Mailpit).
# Copy .env.example to .env and run: docker compose up -d --build
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29
    environment:
      MP_POP3_AUTH: ${POP3_USER}:${POP3_PASSWORD}
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mail-app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_ADDRESS: ${MAIL_ADDRESS}
      POP3_HOST: mailpit
      POP3_PORT: 1110
      POP3_USER: ${POP3_USER}
      POP3_PASSWORD: ${POP3_PASSWORD}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      POLL_INTERVAL: ${POLL_INTERVAL:-30s}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      FILES_ROOT: /app/data/files
    volumes:
      - files:/app/data/files
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  files:
