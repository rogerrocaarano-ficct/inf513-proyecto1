# Production, deployed with Dokploy from the main branch (see README.md, "Ejecutar contra el servidor de
# producción"). Only the application: it uses the mail server (NFR-007) and the database (NFR-008) of
# tecnoweb, with the default profile. No port is published: the application has no HTTP interface.
# Credentials come from the environment variables of the Dokploy project, never from git; a missing
# required variable stops the deployment.
name: cpms-production

services:
  app:
    build: .
    environment:
      CPMS_MAIL_ADDRESS: ${CPMS_MAIL_ADDRESS:?set CPMS_MAIL_ADDRESS, the address of the system mailbox}
      CPMS_MAIL_USERNAME: ${CPMS_MAIL_USERNAME:?set CPMS_MAIL_USERNAME, the POP3 user of the system mailbox}
      CPMS_MAIL_PASSWORD: ${CPMS_MAIL_PASSWORD:?set CPMS_MAIL_PASSWORD, the POP3 password of the system mailbox}
      CPMS_MAIL_POP3_HOST: ${CPMS_MAIL_POP3_HOST:-mail.tecnoweb.org.bo}
      CPMS_MAIL_SMTP_HOST: ${CPMS_MAIL_SMTP_HOST:-mail.tecnoweb.org.bo}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db.tecnoweb.org.bo:5432/db_grupo03sc}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?set SPRING_DATASOURCE_USERNAME, the database user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD, the database password}
      CPMS_ADMIN_EMAIL: ${CPMS_ADMIN_EMAIL:-}
      CPMS_CURRENT_SEMESTER: ${CPMS_CURRENT_SEMESTER:-2026-2}
      # Folder of the cpms-storage volume; back it up together with the database.
      CPMS_STORAGE_ROOT: /var/lib/cpms/storage
    volumes:
      - cpms-storage:/var/lib/cpms/storage
    restart: unless-stopped

volumes:
  cpms-storage:
